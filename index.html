<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23176b62'/%3E%3Cpath d='M7 10h13v12H7zM20 14h4l2 3v5h-6z' fill='white'/%3E%3Ccircle cx='12' cy='23' r='3' fill='%23f2f6f5'/%3E%3Ccircle cx='23' cy='23' r='3' fill='%23f2f6f5'/%3E%3C/svg%3E"><title>配送運用デスク</title><style>
:root{--ink:#19313a;--muted:#61727a;--line:#d7e2e2;--paper:#fff;--canvas:#f2f6f5;--teal:#176b62;--pale:#e0f0ec;--red:#b92d47}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif}button,input,select{font:inherit}.shell{max-width:1300px;margin:auto;padding:20px 16px}header{display:flex;justify-content:space-between;gap:12px;align-items:end}.eyebrow{margin:0;color:var(--teal);font-size:.7rem;font-weight:bold}h1{margin:4px 0;font-size:2rem}.origin{font-size:.75rem;text-align:right;color:var(--muted)}.bar,.panel{margin-top:14px;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:7px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:3px;flex:1 1 140px}label{font-size:.68rem;color:var(--muted);font-weight:bold}input,select{min-height:36px;padding:6px;border:1px solid #b9c9c7;border-radius:4px}.btn{min-height:36px;padding:6px 10px;border:1px solid #9dbdb7;border-radius:4px;background:#fff;color:var(--teal);font-size:.75rem;font-weight:bold;cursor:pointer}.primary{background:var(--teal);border-color:var(--teal);color:#fff}.danger{color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:14px;background:var(--line);border:1px solid var(--line);border-radius:7px;overflow:hidden}.metric{padding:11px;background:#fff}.metric span{display:block;font-size:.67rem;color:var(--muted)}.metric strong{font-size:1.15rem}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.inputrow{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin-top:9px}.note{font-size:.72rem;color:var(--muted)}.dispatch{display:grid;grid-template-columns:minmax(200px,.8fr) repeat(var(--drivers),minmax(210px,1fr));gap:10px;margin-top:14px}.column{min-height:180px;border:1px solid var(--line);border-radius:7px;background:#fff}.chead{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid var(--line)}h2,h3{margin:0;font-size:.9rem}.cap{font-size:.68rem;color:var(--muted)}.over{color:var(--red)}.zone{min-height:125px;padding:6px}.zone.hover{background:var(--pale)}.empty{text-align:center;color:var(--muted);font-size:.72rem;margin:24px 0}.card{margin:0 0 7px;padding:8px;border:1px solid #d7e5e2;border-left:4px solid var(--teal);border-radius:4px;cursor:grab}.top{display:flex;justify-content:space-between;gap:4px}.cargo,.meta{margin-top:4px;font-size:.67rem;color:#46606a}.actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.mini{min-height:25px;padding:2px 5px;border:1px solid #bfcecd;border-radius:3px;background:#fff;color:var(--teal);font-size:.63rem;font-weight:bold}.smallselect{min-height:25px;font-size:.63rem}.settings{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:grid;grid-template-columns:1fr 65px 65px auto;gap:4px;margin-top:4px}.driverrow{grid-template-columns:1fr 80px auto}.history{padding:0;list-style:none}.history button{width:100%;padding:7px;border:0;border-bottom:1px solid var(--line);background:#fff;color:var(--teal);text-align:left}@media(max-width:800px){.dispatch{grid-template-columns:1fr 1fr}.column:first-child{grid-column:1/-1}}@media(max-width:540px){header{align-items:start;flex-direction:column}.origin{text-align:left}.metrics{grid-template-columns:1fr 1fr}.inputrow{grid-template-columns:1fr auto}.inputrow .primary{grid-column:1/-1}.dispatch,.settings{grid-template-columns:1fr}.column:first-child{grid-column:auto}.row{grid-template-columns:1fr 55px 55px auto}}@media print{.bar,.add,.settings-panel,.history-panel,.actions,.smallselect{display:none}.shell{padding:0}.dispatch{grid-template-columns:repeat(var(--drivers),1fr)}.column:first-child{display:none}}
</style></head><body><main class="shell"><header><div><p class="eyebrow">DELIVERY OPERATIONS DESK</p><h1>配送運用デスク</h1></div><p class="origin"><strong id="origin"></strong><br><span id="originAddress"></span></p></header><section class="bar"><div class="field"><label>稼働日</label><input id="date" type="date"></div><div class="field"><label>対象便</label><select id="slot"><option>10時便</option><option>12時便</option><option>14時便</option><option>16時便</option><option>18時便</option></select></div><button class="btn" id="copy">前回の便を複製</button><button class="btn" id="csv">CSV出力</button><button class="btn" id="print">印刷</button></section><section class="metrics"><div class="metric"><span>配送件数</span><strong id="count">0</strong></div><div class="metric"><span>総ポイント</span><strong id="points">0.0</strong></div><div class="metric"><span>総重量</span><strong id="weight">0.0 kg</strong></div><div class="metric"><span>要対応</span><strong id="attention">0</strong></div></section><section class="panel add"><div class="head"><h2>配送先・荷物を追加</h2><button class="btn" id="openSettings">拠点・運用設定</button></div><div class="inputrow"><input id="input" placeholder="例: 高坂、ケース2、コンテナ大小、クーラー大2"><button class="btn primary" id="add">解析して追加</button><button class="btn" id="mic">音声</button></div><p id="message" class="note"></p></section><section id="dispatch" class="dispatch"></section><section id="settings" class="panel settings-panel" hidden><div class="head"><h2>拠点・運用設定</h2><button class="btn" id="closeSettings">閉じる</button></div><div class="settings"><div><h3>店舗拠点</h3><p class="field"><label>店舗名</label><input id="shopName"></p><p class="field"><label>住所</label><input id="shopAddress"></p><h3>車両・ドライバー</h3><div id="drivers"></div><button class="btn" id="addDriver">車両を追加</button></div><div><h3>荷物マスタ</h3><div id="master"></div><button class="btn" id="addMaster">品目を追加</button></div></div><p class="note">設定は地図リンク、積載量警告、自動配分に連動します。</p><button class="btn primary" id="saveSettings">設定を保存</button></section><section class="panel history-panel"><h2>日付別履歴</h2><ul id="history" class="history"></ul></section></main><script src="app.js"></script></body></html>
